name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # vim-vint still imports pkg_resources, removed in setuptools >= 81:
      # pin setuptools and use an explicit venv (pipx/PEP 668 quirks).
      - name: Vim script lint (vint)
        run: |
          python3 -m venv /tmp/vint
          /tmp/vint/bin/pip install -q vim-vint "setuptools<81"
          /tmp/vint/bin/vint --version
          /tmp/vint/bin/vint autoload/ plugin/ syntax/ ftplugin/ tests/smoke.vim

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - name: Install full vim
        run: sudo apt-get update -qq && sudo apt-get install -y -qq vim
      - name: Build the live ~/.vim (fresh install)
        run: |
          set -e
          git init -q ~/.vim && cd ~/.vim
          git config user.email ci@example.invalid
          git config user.name ci
          cat > .gitignore <<'EOF'
          undodir/*
          swapdir/*
          logs/
          *.swp
          *.swo
          .*.swp
          doc/tags
          **/doc/tags
          .netrwhist
          plugin/*-secrets.vim
          EOF
          git submodule add https://github.com/log0u7/vim-plugin-manager.git \
            pack/plugins/start/vim-plugin-manager
          # The vimrc lives in the README (single source of truth): extract
          # the first ```vim block.
          awk '/^```vim$/{f=1;next} /^```$/{if(f) exit} f' \
            "$GITHUB_WORKSPACE/README.md" > vimrc
          ln -s "$GITHUB_WORKSPACE" pack/plugins/start/myvim
          ln -sf ~/.vim/vimrc ~/.vimrc
      - name: First launch (plugin auto-install, wait for async clones)
        run: |
          # PluginEnd clones in parallel and returns immediately: poll the
          # manager's pending-installs map (public test helper), then quit
          # force (the log buffer is modified, plain qa would refuse).
          vim -Nu ~/.vim/vimrc --not-a-term \
            -c 'let l:n=0 | while !empty(plugin_manager#cmd#declare#_pending_names()) && l:n < 600 | sleep 1 | let l:n += 1 | endwhile' \
            -c 'qa!'
          missing=$(cd ~/.vim && git submodule status | grep -c '^-') || true
          echo "missing submodules: $missing"
          [ "$missing" = "0" ]
      - name: Second launch diagnostic (isolated, verbose, time-capped)
        run: |
          set +e
          timeout 90 vim -Nu ~/.vim/vimrc --not-a-term -V1 -c 'qa!' \
            > /tmp/vim-diag.out 2> /tmp/vim-diag.err
          code=$?
          echo "second-launch exit code: $code (124 = hang)"
          echo "--- last vim verbose lines:"
          tail -30 /tmp/vim-diag.err
          echo "--- stdout tail:"
          tail -10 /tmp/vim-diag.out
          [ "$code" != "124" ]