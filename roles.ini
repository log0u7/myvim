# MyVim AI roles - default backend: LOCAL ollama (OpenAI-compatible)
# Service: systemctl --user start ollama
# Any OpenAI-compatible provider works: change endpoint_url + model and set
# options.token_file_path / auth_type for cloud providers.

[default]
options.model = qwen2.5-coder:1.5b
options.endpoint_url = http://localhost:11434/v1/chat/completions
options.auth_type = none
options.request_timeout = 60